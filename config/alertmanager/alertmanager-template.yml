global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        send_resolved: true
        parse_mode: HTML
        message: |
          {{- if eq .Status "firing" -}}
          🔥 <b>ALARM: {{ .CommonLabels.alertname }}</b>
          {{- else -}}
          ✅ <b>RESOLVED: {{ .CommonLabels.alertname }}</b>
          {{- end }}

          <b>Severity:</b> {{ .CommonLabels.severity }}

          {{- range .Alerts }}

          • <b>Name:</b> {{- if .Labels.name }} {{ .Labels.name }}{{- else if .Labels.hostname }} VM {{ .Labels.hostname }}{{- else }} {{ .Labels.instance }}{{- end }}

            <b>Description:</b> {{ .Annotations.description }}

          {{- end }}