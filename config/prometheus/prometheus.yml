global:
  scrape_interval:     15s # By default, scrape targets every 15 seconds.
  evaluation_interval: 15s # By default, scrape targets every 15 seconds.
  # scrape_timeout is set to the global default (10s).

  external_labels:
      monitor: 'app-monitoring'

rule_files:
  - rules/node_alert.rules
  - rules/container_alert.rules

alerting:
  alertmanagers:
  - scheme: http
    static_configs:
    - targets:
      - "alertmanager:9093"

scrape_configs:
  - job_name: 'node-exporter'
    scrape_interval: 15s
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/node_exporter_scrape_job.yml
  - job_name: 'otel-collector'
    scrape_interval: 15s
    always_scrape_classic_histograms: true
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'cadvisor'
    scrape_interval: 15s
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/cadvisor_scrape_job.yml