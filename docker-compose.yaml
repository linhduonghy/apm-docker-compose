networks:
  monitoring:
    external: true # for sharing with other docker-compose
  share_network:
    external: true # for sharing with other docker-compose
volumes:
  htpasswd-data:

services:
  # Since the Loki containers are running as user 10001 and the mounted data volume is owned by root,
  # Loki would not have permissions to create the directories.
  # Therefore the init container changes permissions of the mounted directory.
  init:
    image: &lokiImage grafana/loki:3.7.0
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/loki"
    volumes:
      - /data/loki:/loki
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./config/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yml
      - /data/grafana:/var/lib/grafana
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
    networks:
      - monitoring
      - share_network
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - LOKI_DATASOURCE_AUTH_USER=${AUTH_BASIC_USER}
      - LOKI_DATASOURCE_AUTH_PASS=${AUTH_BASIC_PASSWORD}

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: prometheus
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus/scrapejob:/etc/prometheus/file_sd
      - ./config/prometheus/rules:/etc/prometheus/rules
      - /data/prometheus:/prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=native-histograms'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
      - share_network
    ports:
      - "9999:9090"
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
  
  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
    user: "root"
    volumes:
      - ./script/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh
      - ./config/alertmanager/alertmanager-template.yml:/etc/alertmanager/alertmanager-template.yml
      - /data/alertmanager:/alertmanager
    entrypoint: ["sh", "/etc/alertmanager/entrypoint.sh"]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

  htpasswd-generator:
    image: httpd:2.4
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        htpasswd -nbB ${AUTH_BASIC_USER} ${AUTH_BASIC_PASSWORD} > /htpasswd/.htpasswd
    volumes:
      - htpasswd-data:/htpasswd
    networks:
      - monitoring

  loki-gateway:
    image: nginx:alpine
    container_name: loki-gateway
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - htpasswd-data:/etc/nginx
    ports:
      - "9200:80"      
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 256M
    networks:
      - monitoring
      - share_network

  loki-read:
    image: *lokiImage
    container_name: loki-read
    volumes:
      - ./config/loki.yaml:/etc/loki/loki.yaml
    command: "-config.file=/etc/loki/loki.yaml -config.expand-env=true -target=read -legacy-read-mode=false"
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: 0.5
          memory: 512M
    networks:
      - monitoring
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}

  loki-write:
    image: *lokiImage
    container_name: loki-write
    volumes:
      - ./config/loki.yaml:/etc/loki/loki.yaml
    command: "-config.file=/etc/loki/loki.yaml -config.expand-env=true -target=write"
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: 0.5
          memory: 512M
    networks:
      - monitoring
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}

  loki-backend:
    image: *lokiImage
    container_name: loki-backend
    volumes:
      - ./config/loki.yaml:/etc/loki/loki.yaml
    command: "-config.file=/etc/loki/loki.yaml -config.expand-env=true -target=backend -legacy-read-mode=false"
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: 0.5
          memory: 512M
    networks:
      - monitoring
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}

  init-tempo:
    image: busybox:latest
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tempo"
    volumes:
      - /data/tempo:/var/tempo
    networks:
      - monitoring
  tempo:
    image: grafana/tempo:2.10.0
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml
      - /data/tempo:/var/tempo
    ports:
      - "3200" # tempo
      - "4317" # otlp grpc
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
    restart: unless-stopped
    depends_on:
      - init-tempo
    networks:
      - monitoring
      
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.149.0
    container_name: otel-collector
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml
      - htpasswd-data:/etc/otelcol-contrib
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    ports:
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP HTTP receiver
      - 8889:8889 # Prometheus metrics
    networks:
      - monitoring
      - share_network
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
    environment:
      - AUTH_BASIC_USER=${AUTH_BASIC_USER}
      - AUTH_BASIC_PASSWORD=${AUTH_BASIC_PASSWORD}
